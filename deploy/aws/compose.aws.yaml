# AWS single-instance stack, layered on compose.platform.yaml (the five organization
# hosts on the private `platform` network):
#
#   docker compose -p harvestnet --env-file /opt/harvestnet/deploy.env \
#     -f compose.platform.yaml -f deploy/aws/compose.aws.yaml up -d --no-build
#
# - The core is the real Lane A server (python -m harvestnet_core.server) built into
#   the same image, on SQLite in a named volume (the core's supported single-host option;
#   no Postgres container, so less memory and nothing to back up twice).
# - One image (deploy/aws/Dockerfile) for every service, built once on the instance.
# - The organization hosts run the real policy adapter (harvestnet_core.join_adapter), and the
#   core asks each one for its own organization's moves over signed A2A (HARVESTNET_MOVE_TRANSPORT
#   on the core, below). HARVESTNET_ORG_HOST=harvestnet_platform.agntcy_server swaps the hosts for
#   the native AGNTCY App SDK host; remote_deploy.sh then builds the image with the App SDK. It is
#   heavier per container, so the default stays the JSON-RPC host on the t4g.small.
# - Caddy also serves the frontend apps from the release bundle, on the same origin.
# Built by deploy/aws/remote_deploy.sh, which sets HARVESTNET_RELEASE.
#
# Credentials, one per holder (deploy/load_secrets.py derives the per-host values):
# - Each food bank host gets only its own core staff token (HARVESTNET_STAFF_TOKEN from
#   STAFF_TOKEN_<ORG>) and its own transport keys (compose.platform.yaml). Only the core,
#   which checks them, holds the whole HARVESTNET_STAFF_TOKENS map.
# - The approval bridge holds no staff token: CORE_APPROVALS_TOKEN is the core's
#   HARVESTNET_APPROVALS_TOKEN, which the core accepts only to record one review link's
#   decision for the current version and terms.

x-app-image: &app-image
  image: harvestnet-app:${HARVESTNET_RELEASE:?set by deploy/aws/remote_deploy.sh}
  pull_policy: never

x-agent-env: &agent-env
  AGENT_POLICY: harvestnet_core.join_adapter:policy
  CLAUDE_RUN_CAP_USD: ${CLAUDE_RUN_CAP_USD:-0}
  CLAUDE_TOTAL_CAP_USD: ${CLAUDE_TOTAL_CAP_USD:-}

# The three food bank hosts also run their own cooler watcher (harvestnet_core.cooler_watch,
# #23): it polls that food bank's own cooler reading from the systems service and, when it
# fails, proposes the new version and asks the approval bridge for review emails. Each host
# gets only its own organization's core token, so city cannot act as rural at the core.
# Nobody commits for a food bank; only its human, on the review link, does.
x-bank-env: &bank-env
  <<: *agent-env
  COOLER_WATCH: '1'
  COOLER_WATCH_INTERVAL_SECONDS: ${COOLER_WATCH_INTERVAL_SECONDS:-10}
  SYSTEMS_URL: http://systems:8010
  CORE_API_URL: ${CORE_API_URL:-http://core:8000}
  APPROVALS_URL: http://approvals:8030
  API_EVENTS_TOKEN: ${API_EVENTS_TOKEN:?set API_EVENTS_TOKEN}

services:
  donor:
    <<: *app-image
    environment: *agent-env
  city:
    <<: *app-image
    environment:
      <<: *bank-env
      HARVESTNET_STAFF_TOKEN: ${STAFF_TOKEN_CITY:?set STAFF_TOKEN_CITY (deploy/load_secrets.py)}
  rural:
    <<: *app-image
    environment:
      <<: *bank-env
      HARVESTNET_STAFF_TOKEN: ${STAFF_TOKEN_RURAL:?set STAFF_TOKEN_RURAL (deploy/load_secrets.py)}
  eastside:
    <<: *app-image
    environment:
      <<: *bank-env
      HARVESTNET_STAFF_TOKEN: ${STAFF_TOKEN_EASTSIDE:?set STAFF_TOKEN_EASTSIDE (deploy/load_secrets.py)}
  advocate:
    <<: *app-image
    environment: *agent-env

  systems:
    <<: *app-image
    command: [python, -m, harvestnet_platform.systems, --host, 0.0.0.0]
    environment:
      BEECEPTOR_BASE_URL: ${BEECEPTOR_BASE_URL:-}
      DEMO_SWITCH_TOKEN: ${DEMO_SWITCH_TOKEN:?set DEMO_SWITCH_TOKEN}
      COOLER_STATE_PATH: /app/runtime/coolers.json
    volumes: [systems-data:/app/runtime]
    networks: [platform, egress]
    restart: unless-stopped

  approvals:
    <<: *app-image
    command: [python, -m, harvestnet_platform.approvals, --host, 0.0.0.0]
    environment:
      API_EVENTS_TOKEN: ${API_EVENTS_TOKEN:?set API_EVENTS_TOKEN}
      APPROVAL_PUBLIC_URL: ${APPROVAL_PUBLIC_URL:?set APPROVAL_PUBLIC_URL}
      CORE_API_URL: ${CORE_API_URL:-http://core:8000}
      CORE_APPROVALS_TOKEN: ${HARVESTNET_APPROVALS_TOKEN:?set HARVESTNET_APPROVALS_TOKEN}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      N8N_APPROVAL_WEBHOOK_URL: ${N8N_APPROVAL_WEBHOOK_URL:-}
      APPROVER_EMAILS_JSON: ${APPROVER_EMAILS_JSON:-}
      SES_TEST_RECIPIENTS: ${SES_TEST_RECIPIENTS:-}
      ALLOW_INTERNAL_HTTP: '1'
      APPROVALS_DB: /app/runtime/approvals.sqlite
    volumes: [approvals-data:/app/runtime]
    networks: [platform, egress]
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

  core:
    <<: *app-image
    command: [python, -m, harvestnet_core.server]
    environment:
      HOST: 0.0.0.0
      PORT: '8000'
      DATABASE_URL: /app/data/core.sqlite
      HARVESTNET_FIXTURE: docs/contracts/examples/scenario-normal-afternoon.json
      HARVESTNET_ALLOWED_ORIGIN: ${HARVESTNET_ALLOWED_ORIGIN:?set HARVESTNET_ALLOWED_ORIGIN}
      HARVESTNET_STAFF_TOKENS: ${HARVESTNET_STAFF_TOKENS:?set HARVESTNET_STAFF_TOKENS}
      HARVESTNET_APPROVALS_TOKEN: ${HARVESTNET_APPROVALS_TOKEN:?set HARVESTNET_APPROVALS_TOKEN}
      # Live moves come from each organization's own host (harvestnet_core/move_transport.py):
      # the core signs a move request as the turn publisher, `core`, for the organization whose
      # turn it is, and checks the reply against the keys the organizations derived for `core`.
      # A turn a host cannot answer is made in process and recorded as in_process_fallback.
      # HARVESTNET_MOVE_TRANSPORT=in_process (in the secret) runs every negotiator in the core.
      HARVESTNET_MOVE_TRANSPORT: ${HARVESTNET_MOVE_TRANSPORT:-a2a}
      AGENT_ENDPOINTS: '{"market":"http://donor:8020","city":"http://city:8020","rural":"http://rural:8020","eastside":"http://eastside:8020","advocate":"http://advocate:8020"}'
      # Rules moves take milliseconds; a host that hangs costs at most this, then its turns fall
      # back (labeled) for MOVE_HOST_RETRY_SECONDS before it is asked again.
      AGENT_TURN_TIMEOUT_SECONDS: ${AGENT_TURN_TIMEOUT_SECONDS:-15}
      MOVE_HOST_RETRY_SECONDS: '30'
      ALLOW_INTERNAL_HTTP: '1'
      TRANSPORT_SENDER: core
      TRANSPORT_SIGNING_KEY: ${TRANSPORT_SIGNING_KEY_CORE:?set TRANSPORT_SIGNING_KEY_CORE (deploy/load_secrets.py)}
      TRANSPORT_VERIFY_KEYS: ${TRANSPORT_VERIFY_KEYS_CORE:?set TRANSPORT_VERIFY_KEYS_CORE (deploy/load_secrets.py)}
      CLAUDE_RUN_CAP_USD: ${CLAUDE_RUN_CAP_USD:-0}
      CLAUDE_TOTAL_CAP_USD: ${CLAUDE_TOTAL_CAP_USD:-}
      CLAUDE_SPEND_LEDGER: /app/budget/claude-spend.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HARVESTNET_HOUSEHOLD_URL: ${HARVESTNET_HOUSEHOLD_URL:-}
      N8N_PICKUP_WEBHOOK_URL: ${N8N_PICKUP_WEBHOOK_URL:-}
      N8N_RELEASE_WEBHOOK_URL: ${N8N_RELEASE_WEBHOOK_URL:-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      SES_TEST_RECIPIENTS: ${SES_TEST_RECIPIENTS:-}
    volumes: [core-data:/app/data, budget-data:/app/budget]
    networks: [platform, egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  gateway:
    image: caddy:2.10.2-alpine
    environment:
      HARVESTNET_DOMAIN: ${HARVESTNET_DOMAIN:?set HARVESTNET_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/aws/frontends.caddy:/etc/caddy/frontends.caddy:ro
      - ./frontend-dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [platform, egress]
    depends_on: [approvals, core]
    restart: unless-stopped

networks:
  egress:

volumes:
  systems-data:
  approvals-data:
  core-data:
  budget-data:
  caddy-data:
  caddy-config:
