[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harvestnet-api-skeleton"
version = "0.1.0"
description = "HarvestNet ticket #1: the public API skeleton, serving the agreed example responses (stdlib only)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
harvestnet-api-skeleton = "harvestnet_api_skeleton.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
