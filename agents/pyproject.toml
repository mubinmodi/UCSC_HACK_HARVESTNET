[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harvestnet-agents"
version = "0.1.0"
description = "HarvestNet Lane B: negotiators, produce profiles, fair-share table, front-desk assistant, cooler-failure logic"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Only the live front-desk extractor needs the Claude SDK; tests never call the API.
claude = ["anthropic>=1.13"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harvestnet_agents = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
