# The five organization hosts on the private `platform` network.
#
# Each host gets only its own transport keys (harvestnet_platform/transport_auth.py):
# TRANSPORT_SIGNING_KEY is its own sending key, and TRANSPORT_VERIFY_KEYS holds only the
# keys derived for it, so it can check messages addressed to it but cannot speak for
# anyone else. Generate a local set (never commit it) with
#   python -m harvestnet_platform.transport_auth --output runtime/transport.env
# On AWS, deploy/load_secrets.py derives the same variables from the secret's TRANSPORT_KEYS.
x-agent: &agent
  build:
    context: .
    dockerfile: Dockerfile.platform
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  networks: [platform]
  environment: &agent-env
    ALLOW_INTERNAL_HTTP: '1'
    RECEIPTS_DB: /app/runtime/receipts.sqlite
services:
  # The service (container) name stays `donor` so deployment overlays keep matching;
  # the organization it hosts is `market` (docs/contracts/README.md decision 1).
  donor:
    <<: *agent
    command: [python, -m, harvestnet_platform.transport, --organization, market, --host, 0.0.0.0]
    environment:
      <<: *agent-env
      AGENT_PUBLIC_URL: http://donor:8020
      TRANSPORT_SIGNING_KEY: ${TRANSPORT_SIGNING_KEY_MARKET:?set TRANSPORT_SIGNING_KEY_MARKET}
      TRANSPORT_VERIFY_KEYS: ${TRANSPORT_VERIFY_KEYS_MARKET:?set TRANSPORT_VERIFY_KEYS_MARKET}
    volumes: [donor-data:/app/runtime]
  city:
    <<: *agent
    command: [python, -m, harvestnet_platform.transport, --organization, city, --host, 0.0.0.0]
    environment:
      <<: *agent-env
      AGENT_PUBLIC_URL: http://city:8020
      TRANSPORT_SIGNING_KEY: ${TRANSPORT_SIGNING_KEY_CITY:?set TRANSPORT_SIGNING_KEY_CITY}
      TRANSPORT_VERIFY_KEYS: ${TRANSPORT_VERIFY_KEYS_CITY:?set TRANSPORT_VERIFY_KEYS_CITY}
    volumes: [city-data:/app/runtime]
  rural:
    <<: *agent
    command: [python, -m, harvestnet_platform.transport, --organization, rural, --host, 0.0.0.0]
    environment:
      <<: *agent-env
      AGENT_PUBLIC_URL: http://rural:8020
      TRANSPORT_SIGNING_KEY: ${TRANSPORT_SIGNING_KEY_RURAL:?set TRANSPORT_SIGNING_KEY_RURAL}
      TRANSPORT_VERIFY_KEYS: ${TRANSPORT_VERIFY_KEYS_RURAL:?set TRANSPORT_VERIFY_KEYS_RURAL}
    volumes: [rural-data:/app/runtime]
  eastside:
    <<: *agent
    command: [python, -m, harvestnet_platform.transport, --organization, eastside, --host, 0.0.0.0]
    environment:
      <<: *agent-env
      AGENT_PUBLIC_URL: http://eastside:8020
      TRANSPORT_SIGNING_KEY: ${TRANSPORT_SIGNING_KEY_EASTSIDE:?set TRANSPORT_SIGNING_KEY_EASTSIDE}
      TRANSPORT_VERIFY_KEYS: ${TRANSPORT_VERIFY_KEYS_EASTSIDE:?set TRANSPORT_VERIFY_KEYS_EASTSIDE}
    volumes: [eastside-data:/app/runtime]
  advocate:
    <<: *agent
    command: [python, -m, harvestnet_platform.transport, --organization, advocate, --host, 0.0.0.0]
    environment:
      <<: *agent-env
      AGENT_PUBLIC_URL: http://advocate:8020
      TRANSPORT_SIGNING_KEY: ${TRANSPORT_SIGNING_KEY_ADVOCATE:?set TRANSPORT_SIGNING_KEY_ADVOCATE}
      TRANSPORT_VERIFY_KEYS: ${TRANSPORT_VERIFY_KEYS_ADVOCATE:?set TRANSPORT_VERIFY_KEYS_ADVOCATE}
    volumes: [advocate-data:/app/runtime]
networks:
  platform:
    internal: true
volumes:
  donor-data:
  city-data:
  rural-data:
  eastside-data:
  advocate-data:
