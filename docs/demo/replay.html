<script>
(function () {
  'use strict';
  var R = JSON.parse(document.getElementById('recording').textContent);
  if (!R.kind) { document.getElementById('screen').innerHTML = '<h2>No recording yet</h2><p>Run <code>python -m harvestnet_core.demo_replay</code>.</p>'; return; }
  var lang = 'es';
  var TZ = 'America/Los_Angeles';
  var ORG = R.organizations || {};
  var BANKS = ['city', 'rural', 'eastside'];

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // Display formatting only: times are shown in the scenario's time zone.
  function time(iso) { return new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(new Date(iso)); }
  function day(iso) { return new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(iso)); }
  function span(w) { return time(w.start) + ' to ' + time(w.end); }
  function lb(v) { return (Math.round(v * 100) / 100) + ' lb'; }
  function org(id) { return ORG[id] || id; }
  function item(id) { var i = R.offer.items.filter(function (x) { return x.produce_id === id; })[0]; return i ? i.name : id; }
  function pct(v) { return v === null || v === undefined ? 'not run' : (Math.round(v * 1000) / 10) + '%'; }
  function cellOrNot(v, f) { return v === null || v === undefined ? '<td class="num muted">not run</td>' : '<td class="num">' + (f ? f(v) : v) + '</td>'; }
  function label() { return '<p class="small">Synthetic data · recorded from the code with <code>' + esc(R.generated_by) + '</code> · fixture <code>' + esc(R.fixture) + '</code>.</p>'; }

  function allocationTable(version) {
    var rows = R.offer.items.map(function (it) {
      var placed = 0;
      var cells = BANKS.map(function (b) {
        var a = version.allocations.filter(function (x) { return x.produce_id === it.produce_id && x.food_bank_id === b; })[0];
        if (a) placed += a.pounds;
        return '<td class="num">' + (a ? lb(a.pounds) : '<span class="muted">·</span>') + '</td>';
      }).join('');
      return '<tr><td>' + esc(it.name) + ' <span class="small">(' + lb(it.pounds) + ' offered)</span></td>' + cells +
        '<td class="num">' + lb(it.pounds - placed) + '</td></tr>';
    }).join('');
    var transports = version.transports.length ? version.transports.map(function (t) {
      return esc(org(t.food_bank_id)) + ': ' + (t.mover === 'donor' ? 'the donor drops off' : 'the food bank collects') + ', ' + time(t.departs_at) + ' to ' + time(t.arrives_at);
    }).join(' · ') : 'Who moves it: not agreed yet.';
    return '<table><tr><th>Version ' + version.version + '</th>' + BANKS.map(function (b) { return '<th class="num">' + esc(org(b)) + '</th>'; }).join('') +
      '<th class="num">Not placed yet</th></tr>' + rows + '</table><p class="small">' + transports + '</p>';
  }

  var moves = R.negotiation.moves;
  var versions = R.negotiation.versions;
  function versionAfter(moveIndex) {
    // The newest version recorded by the time of this move (an amendment follows its move).
    var next = moveIndex + 1 < moves.length ? moves[moveIndex + 1].sequence : Infinity, best = versions[0];
    versions.forEach(function (v) { if (v.sequence < next) best = v; });
    return best;
  }

  var STEPS = [
    { title: 'Start', render: function () {
      return '<h2>Recorded replay of the demo scenario</h2>' +
        '<p class="lead">' + esc(R.note) + '</p>' +
        '<div class="card"><h3>One labeled change from the shipped scenario</h3><p>' + esc(R.variant.description) + '</p></div>' +
        '<h3>What you will see</h3><ol><li>A household asks for produce.</li><li>A farmers market offers surplus.</li>' +
        '<li>The agents negotiate, move by move, with reasons.</li><li>Holds, approvals, and the commitment.</li>' +
        '<li>Pickups for households.</li><li>The city cooler fails: reason cards and a new version.</li>' +
        '<li>Households with an address can get new pickup emails.</li><li>Pickups and the results.</li></ol>' + label();
    } },
    { title: '1 Household', render: function () {
      var h = R.household, t = h.by_language[lang], a = h.answers;
      var windows = a.pickup_windows.map(function (w) { return w.days.join(', ') + (w.start ? ' after ' + w.start : '') + (w.end ? ' until ' + w.end : ''); }).join('; ');
      return '<h2>1 · A household asks for produce</h2>' +
        '<div class="grid g2"><div class="card"><h3>What the household said (no name, no address)</h3><table>' +
        '<tr><td>Household</td><td>' + a.household_size + ' people</td></tr><tr><td>Pickup</td><td>' + esc(windows) + '</td></tr>' +
        '<tr><td>Limited fridge</td><td>' + (a.limited_fridge ? 'yes' : 'no') + '</td></tr><tr><td>Neighborhood</td><td>' + esc(a.neighborhood) + '</td></tr>' +
        '<tr><td>Can’t eat</td><td>' + esc(a.cant_eat.join(', ') || 'nothing') + '</td></tr><tr><td>SNAP/CalFresh</td><td>' + esc(a.snap) + '</td></tr>' +
        '<tr><td>Language</td><td>' + esc(a.language) + '</td></tr><tr><td>Chose</td><td>' + h.chosen_food_bank_ids.map(org).map(esc).join(', ') + '</td></tr></table>' +
        '<p class="small">Code ' + esc(h.request_code) + ' · came in by ' + esc(h.channel) + '. The replay shows the same templates through the web-form path; no voice transcript is recorded.</p></div>' +
        '<div class="card"><h3>What the front-desk assistant says (' + (lang === 'es' ? 'Spanish' : 'English') + ')</h3>' +
        '<p class="small">Read-back</p><div class="say">' + esc(t.read_back) + '</div>' +
        '<p class="small">Consent, before anything is saved</p><div class="say">' + esc(t.consent_question) + '</div>' +
        '<p class="small">Fair share, from the calculator (table ' + esc(t.table_version) + (t.is_placeholder ? ', a placeholder' : '') + ')</p><div class="say">' + esc(t.fair_share_wording) + '</div>' +
        '<p class="small">Press L for ' + (lang === 'es' ? 'English' : 'Spanish') + '.</p></div></div>' + label();
    } },
    { title: '2 Offer', render: function () {
      var o = R.offer, d = o.drop_off;
      var rows = o.items.map(function (i) {
        return '<tr><td>' + esc(i.name) + ' <span class="small">(' + esc(i.name_es) + ')</span></td><td class="num">' + i.quantity + ' ' + esc(i.unit) +
          (i.lb_per_unit ? ' × ' + i.lb_per_unit + ' lb' : '') + '</td><td class="num">' + lb(i.pounds) + '</td><td>' + esc(i.condition_grade) + '</td><td>' +
          (i.needs_fridge ? '<span class="tag no">needs a fridge</span>' : '<span class="tag ok">keeps without a fridge</span>') + '</td></tr>';
      }).join('');
      return '<h2>2 · ' + esc(org(o.donor_id)) + ' offers its surplus</h2>' +
        '<p>Reported ' + time(o.reported_at) + '. It must be gone by ' + time(o.deadline) + '.</p>' +
        '<table><tr><th>Item</th><th class="num">Quantity</th><th class="num">Pounds</th><th>Condition</th><th>Produce profile</th></tr>' + rows + '</table>' +
        (d ? '<p>Can drop off ' + span(d.window) + ', up to ' + lb(d.capacity_lb) + ', ' + (d.refrigerated ? 'refrigerated' : 'not refrigerated') + ', at ' + d.food_bank_ids.map(org).map(esc).join(' and ') + '.</p>' : '<p>Cannot drop off.</p>') +
        label();
    } },
    { title: '3 Negotiation', sub: moves.length, render: function (k) {
      var list = moves.slice(0, k + 1).map(function (m, i) {
        return '<div class="move' + (i === k ? ' current' : '') + '"><span class="who">' + esc(org(m.organization_id)) + '</span><span>v' + m.version + '</span><span>' + esc(m.action.replace(/_/g, ' ')) + '</span><span class="why">' + esc(m.reason) + '</span></div>';
      }).join('');
      return '<h2>3 · The agents negotiate <span class="small">move ' + (k + 1) + ' of ' + moves.length + '</span></h2>' +
        '<div class="grid g32"><div><div class="moves" id="moves">' + list + '</div><p class="small">Next steps through the moves. End jumps to the last move.</p></div>' +
        '<div>' + allocationTable(versionAfter(k)) + '<p class="small">Each change makes a new version. The advocate proposes but has no vote.</p></div></div>';
    } },
    { title: '4 Approvals', render: function () {
      var holds = R.holds.map(function (h) {
        return '<tr><td>' + esc(org(h.data.organization_id)) + '</td><td>' + h.data.holds.map(function (x) { return esc(x.resource.replace(/_/g, ' ')) + ' ' + lb(x.pounds) + ', ' + span(x); }).join('<br>') + '</td></tr>';
      }).join('');
      var approvals = R.approvals.map(function (a) {
        return '<tr><td>' + esc(org(a.data.organization_id)) + '</td><td>' + esc(a.data.decision) + ' version ' + a.data.version + '</td><td>' + time(a.at) + '</td></tr>';
      }).join('');
      var final = versions.filter(function (v) { return v.version === R.commitment.version; })[0];
      return '<h2>4 · Holds, approvals, and the commitment</h2>' +
        '<div class="grid g2"><div><h3>Each organization holds only its own resources</h3><table>' + holds + '</table>' +
        '<h3>Each organization’s human approves the exact version</h3><table>' + approvals + '</table>' +
        '<p class="small">Scripted humans stand in for the managers. Terms hash ' + esc(R.commitment.terms_hash.slice(0, 19)) + '…</p></div>' +
        '<div><h3>Committed at ' + time(R.commitment.at) + ': version ' + R.commitment.version + '</h3>' + allocationTable(final) + '</div></div>';
    } },
    { title: '5 Pickups', render: function () {
      var rows = R.pickup_notices.map(function (p) {
        return '<tr><td>' + esc(p.request_code) + '</td><td>' + esc(p.food_bank_name) + '</td><td>' + span(p.window) + '</td><td>' + p.items.map(function (i) { return lb(i.pounds) + ' ' + esc(i.name.toLowerCase()); }).join(', ') + '</td></tr>';
      }).join('');
      var page = R.household_page_before[lang];
      return '<h2>5 · Pickups, up to each household’s fair share</h2>' +
        '<div class="grid g2"><div><table><tr><th>Code</th><th>Food bank</th><th>Window</th><th>Portion</th></tr>' + rows + '</table>' +
        '<p class="small">Portions come from the portion calculator. Only committed produce is shown to households.</p></div>' +
        '<div class="card"><h3>' + esc(R.household.request_code) + '’s pickup page (' + (lang === 'es' ? 'Spanish' : 'English') + ')</h3>' +
        page.pickups.map(function (p) { return '<div class="say">' + esc(p.wording) + '</div>'; }).join('') + '</div></div>';
    } },
    { title: '6 Cooler fails', render: function () {
      var cf = R.cooler_failure, d = cf.dashboard, f = cf.fault;
      var items = d.items.move.map(function (i) { return '<li><span class="tag no">moves</span> ' + esc(i.reason) + '</li>'; }).join('') +
        d.items.stay.map(function (i) { return '<li><span class="tag ok">stays</span> ' + esc(i.reason) + '</li>'; }).join('');
      var cards = d.reason_cards.map(function (c) {
        return '<div class="card ' + esc(c.outcome) + '"><h3>' + esc(c.name) + ' <span class="tag ' + (c.outcome === 'chosen' ? 'ok' : 'no') + '">' + esc(c.outcome) + '</span></h3><p>' + esc(c.text) + '</p></div>';
      }).join('');
      var moved = cf.terms.moves.map(function (m) { return lb(m.pounds) + ' ' + esc(item(m.produce_id).toLowerCase()) + ' from ' + esc(org(m.from_food_bank_id)) + ' to ' + esc(org(m.to_food_bank_id)) + ' by ' + esc(m.mover) + ', ' + time(m.departs_at) + ' to ' + time(m.arrives_at); }).join('; ');
      var fallback = cf.terms.fallback.map(function (x) { return esc(x.reason); }).join(' ');
      var decisions = cf.events.filter(function (e) { return e.kind === 'change_decision' || e.kind === 'change_refused'; }).map(function (e) {
        return esc(org(e.data.organization_id)) + ': ' + esc(e.data.decision || ('refused: ' + e.data.reason)) + ' at ' + time(e.at);
      }).join(' · ');
      return '<h2>6 · The city cooler fails at ' + time(f.at) + ' <span class="small">(' + esc(f.source.replace(/_/g, ' ')) + ', ' + f.reading.temperature_c + ' °C, synthetic)</span></h2>' +
        '<div class="grid g2"><div><h3>The produce profile decides what must move</h3><ul>' + items + '</ul>' +
        '<h3>Version ' + cf.terms.version + ' (based on ' + cf.terms.based_on_version + ')</h3><p>' + moved + '.</p><p class="small">' + fallback + '</p>' +
        '<p><b>Fresh approvals:</b> ' + decisions + '. Status: <b>' + esc(cf.status) + '</b>.</p></div>' +
        '<div><h3>A reason card for every food bank found</h3>' + cards +
        '<p class="small">' + esc(d.flags.filter(function (x) { return x.indexOf('Directory') === 0; }).join(' ')) + '</p></div></div>';
    } },
    { title: '7 Emails', render: function () {
      var emails = R.household_emails.map(function (t) {
        return '<div class="card"><h3>' + esc(t.request_code) + ' <span class="small">(' + esc(t.language) + ')</span> ' +
          (t.reply_expected ? '<span class="tag no">didn’t choose ' + esc(t.food_bank) + ': release link offered</span>' : '<span class="tag ok">chose ' + esc(t.food_bank) + '</span>') +
          '</h3><div class="say">' + esc(t.message) + '</div></div>';
      }).join('');
      var after = R.household_page_after && R.household_page_after[lang];
      return '<h2>7 · Households whose pickup moved have a new email prepared</h2><div class="grid g2">' + emails + '</div>' +
        (after ? '<h3>' + esc(R.household.request_code) + '’s pickup page now (' + (lang === 'es' ? 'Spanish' : 'English') + ')</h3>' + after.pickups.map(function (p) { return '<div class="say">' + esc(p.wording) + '</div>'; }).join('') : '') +
        '<p class="small">No email addresses are in this synthetic scenario, so no email was sent. These are prepared notice bodies.</p>';
    } },
    { title: '8 Results', render: function () {
      var m = R.metrics;
      var codes = {}; R.pickup_notices.forEach(function (p) { codes[p.pickup_id] = p.request_code; });
      var out = R.pickup_outcomes.map(function (e) { return '<tr><td>' + esc(codes[e.data.pickup_id] || e.data.pickup_id) + '</td><td>' + (e.kind === 'pickup_confirmation' ? 'collected' : 'released ("can’t make it")') + '</td><td class="num">' + lb(e.data.pounds) + '</td><td>' + time(e.at) + '</td></tr>'; }).join('');
      var NAMES = { first_come_first_served: 'First-come-first-served', nearest_food_bank: 'Nearest food bank', rules_based: 'Rules-based negotiators', llm: 'LLM negotiators' };
      var shipped = R.results.shipped.map(function (s) {
        var rows = s.methods.map(function (x) {
          var cf = x.cooler_failure ? ' <span class="small">(cooler change: ' + esc(x.cooler_failure.change_statuses.join(', ')) + (x.cooler_failure.held_for_human_lb ? ', ' + lb(x.cooler_failure.held_for_human_lb) + ' held for a human' : '') + ')</span>' : '';
          return '<tr><td>' + NAMES[x.method] + cf + '</td>' + cellOrNot(x.collected_by_households_lb, lb) + cellOrNot(x.committed_to_food_banks_lb, lb) + cellOrNot(x.produce_wasted_lb, lb) + cellOrNot(x.worst_served_coverage, pct) + cellOrNot(x.households_reached) + cellOrNot(x.invalid_commitments) + '</tr>';
        }).join('');
        return '<h3>' + esc(s.scenario_id) + ' <span class="small">(shipped fixture, ' + esc(s.run_mode) + ')</span></h3><table><tr><th>Method</th><th class="num">Collected by households</th><th class="num">Committed to food banks</th><th class="num">Wasted</th><th class="num">Worst-served coverage</th><th class="num">Households reached</th><th class="num">Invalid commitments</th></tr>' + rows + '</table>';
      }).join('');
      return '<h2>8 · Pickups and results</h2><div class="grid g2"><div><h3>What happened at pickup in this recording</h3><table><tr><th>Code</th><th>Outcome</th><th class="num">Pounds</th><th>At</th></tr>' + out + '</table>' +
        '<p>This recording (rules-based, with the variant): ' + lb(m.collected_by_households_lb) + ' collected by households, ' + lb(m.committed_to_food_banks_lb) + ' committed to food banks, ' + lb(m.produce_wasted_lb) + ' wasted, worst-served coverage ' + pct(m.worst_served_coverage) +
        ', ' + m.households_reached + ' households reached, ' + m.invalid_commitments + ' invalid commitments; the cooler change moved ' + lb(m.cooler_failure.pounds_moved) + '.</p>' +
        '<p class="small">' + esc(R.results.shipped[0].note) + '</p></div><div>' + shipped + '</div></div>' + label();
    } }
  ];

  var step = 0, sub = 0;
  var stepsNav = document.getElementById('steps');
  STEPS.forEach(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = s.title;
    b.addEventListener('click', function () { go(i, 0); });
    stepsNav.appendChild(b);
  });
  function go(i, k) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    var n = STEPS[step].sub || 1;
    sub = Math.max(0, Math.min(n - 1, k));
    document.getElementById('screen').innerHTML = STEPS[step].render(sub);
    var list = document.getElementById('moves');
    if (list) { var cur = list.querySelector('.current'); if (cur) list.scrollTop = cur.offsetTop - list.offsetTop - list.clientHeight / 2; }
    Array.prototype.forEach.call(stepsNav.children, function (b, j) { if (j === step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    document.getElementById('where').textContent = 'Step ' + (step + 1) + ' of ' + STEPS.length;
    document.getElementById('back').disabled = step === 0 && sub === 0;
    document.getElementById('next').disabled = step === STEPS.length - 1;
  }
  function next() { var n = STEPS[step].sub || 1; if (sub < n - 1) go(step, sub + 1); else go(step + 1, 0); }
  function back() { if (sub > 0) go(step, sub - 1); else if (step > 0) { var p = STEPS[step - 1].sub || 1; go(step - 1, p - 1); } }
  document.getElementById('next').addEventListener('click', next);
  document.getElementById('back').addEventListener('click', back);
  document.getElementById('lang').addEventListener('click', function () { lang = lang === 'es' ? 'en' : 'es'; go(step, sub); });
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { next(); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { back(); e.preventDefault(); }
    else if (k === 'Home') { go(0, 0); e.preventDefault(); }
    else if (k === 'End') { var n = STEPS[step].sub || 1; if (sub < n - 1) go(step, n - 1); else go(STEPS.length - 1, 0); e.preventDefault(); }
    else if (k === 'l' || k === 'L') { lang = lang === 'es' ? 'en' : 'es'; go(step, sub); }
    else if (k === 't' || k === 'T') { var r = document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
  });
  document.getElementById('mode').textContent = (R.synthetic ? 'Synthetic' : R.mode) + ' · ' + (R.label || 'Recorded replay');
  go(0, 0);
})();
</script>
</body>
</html>
