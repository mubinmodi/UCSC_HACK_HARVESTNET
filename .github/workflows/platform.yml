name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install a2a-sdk==0.3.20 agntcy-dir==1.0.0 pytest==8.4.2
      - run: python -m pytest tests -v
      - run: python integrations/n8n/build_workflows.py && git diff --exit-code -- integrations/n8n
      - name: Validate deployment configuration without revealing secrets
        # Placeholder per-host transport keys, written to a 0600 file and never printed.
        run: |
          python -m harvestnet_platform.transport_auth --output "$RUNNER_TEMP/transport.env"
          docker compose --env-file "$RUNNER_TEMP/transport.env" -f compose.platform.yaml -f compose.agntcy.yaml config --quiet
  native-agntcy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-agntcy.txt
      - run: python -m unittest discover -s tests -p test_native_agntcy.py -v
  lane-b-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Lane B's agents/ is in this repository, so the check runs against the same commit.
      - name: Verify in-repo real rules with recorded calculators over HTTP
        env:
          PYTHONPATH: agents/src
          LANE_B_FIXTURES: agents/tests/fixtures/negotiators
        run: python -m unittest discover -s tests -p test_lane_b.py -v
